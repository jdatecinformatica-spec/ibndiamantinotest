<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completar Cadastro — IBN Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0A1A3F', secondary: '#D4AF37', light: '#F8F9FC' }
                }
            }
        }
    </script>
</head>
<body class="bg-light min-h-screen py-8 px-4">
    <div class="max-w-lg mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-primary">📋 Completar Cadastro</h1>
            <p class="text-gray-600 mt-2">Passo 2 de 2 — Informações adicionais</p>
        </div>

        <div class="bg-white p-8 rounded-xl shadow-lg">
            <form id="formCompleto" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">E-mail</label>
                    <input type="email" id="email" required class="w-full p-3 border rounded-lg" placeholder="seuemail@exemplo.com">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Sexo</label>
                        <select id="sexo" class="w-full p-3 border rounded-lg">
                            <option value="">Selecione...</option>
                            <option value="masculino">Masculino</option>
                            <option value="feminino">Feminino</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Data de Nascimento</label>
                        <input type="date" id="nascimento" class="w-full p-3 border rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Estado Civil</label>
                        <select id="estadoCivil" class="w-full p-3 border rounded-lg">
                            <option value="">Selecione...</option>
                            <option value="solteiro">Solteiro(a)</option>
                            <option value="casado">Casado(a)</option>
                            <option value="divorciado">Divorciado(a)</option>
                            <option value="viuvo">Viúvo(a)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Endereço Completo</label>
                        <input type="text" id="endereco" class="w-full p-3 border rounded-lg" placeholder="Rua, número, bairro, cidade/UF">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Resposta (opcional)</label>
                    <p class="text-xs text-gray-500 mb-2">Responda se quiser: Veio de outra igreja ou ministério?</p>
                    <textarea id="origem" rows="2" class="w-full p-3 border rounded-lg" placeholder="Se sim, de onde? Pode deixar em branco se preferir."></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Foi batizado(a)?</label>
                        <select id="batizado" class="w-full p-3 border rounded-lg">
                            <option value="">Selecione...</option>
                            <option value="sim">Sim</option>
                            <option value="nao">Não</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Data do Batismo (se souber)</label>
                        <input type="date" id="dataBatismo" class="w-full p-3 border rounded-lg">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Observações / Ministério (se houver)</label>
                    <textarea id="observacoes" rows="2" class="w-full p-3 border rounded-lg" placeholder="Ex: Louvor, Diáconato, etc."></textarea>
                </div>

                <div id="msg" class="text-sm hidden"></div>
                <button type="submit" class="w-full bg-secondary text-primary p-3 rounded-lg font-bold hover:opacity-90 transition">
                    <i class="fa fa-check-circle mr-2"></i> Concluir e Acessar o Site
                </button>
            </form>
        </div>
    </div>

    <script>
        const usuario = JSON.parse(localStorage.getItem('usuarioLogado') || 'null');
        if (!usuario) {
            alert('Faça o cadastro primeiro.');
            window.location.href = 'cadastro.html';
        }

        function getMembros() {
            try { return JSON.parse(localStorage.getItem('membrosCadastro') || '[]'); }
            catch { return []; }
        }
        function salvarMembroCompleto(dadosAtualizados) {
            const lista = getMembros();
            const indice = lista.findIndex(m => m.nome === usuario.nome && m.telefone === usuario.telefone);
            if (indice !== -1) {
                lista[indice] = { ...lista[indice], ...dadosAtualizados };
                localStorage.setItem('membrosCadastro', JSON.stringify(lista));
            }
        }

        document.getElementById('formCompleto').addEventListener('submit', (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim().toLowerCase();
            const lista = getMembros();
            
            if (lista.some(m => m.email === email)) {
                const msg = document.getElementById('msg');
                msg.textContent = '❌ Este e-mail já está cadastrado.';
                msg.className = 'text-red-500 mt-2';
                msg.classList.remove('hidden');
                return;
            }

            const dadosComplementares = {
                email,
                sexo: document.getElementById('sexo').value,
                nascimento: document.getElementById('nascimento').value,
                estadoCivil: document.getElementById('estadoCivil').value,
                endereco: document.getElementById('endereco').value.trim(),
                origem: document.getElementById('origem').value.trim(),
                batizado: document.getElementById('batizado').value,
                dataBatismo: document.getElementById('dataBatismo').value,
                observacoes: document.getElementById('observacoes').value.trim(),
                cadastroCompleto: true
            };

            salvarMembroCompleto(dadosComplementares);

            localStorage.setItem('usuarioLogado', JSON.stringify({
                ...usuario,
                email,
                cadastroCompleto: true
            }));

            const msg = document.getElementById('msg');
            msg.textContent = '✅ Cadastro concluído! Bem-vindo(a), ' + usuario.nome + '!';
            msg.className = 'text-green-600 mt-2 text-center font-bold';
            msg.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1500);
        });
    </script>
</body>
</html>
