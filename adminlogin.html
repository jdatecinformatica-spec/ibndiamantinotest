<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Gestor — IBN Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#0A1A3F', secondary: '#D4AF37' } } } }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6 text-primary">Acesso Gestor / Admin</h1>
        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block font-semibold mb-1">Usuário ou e-mail</label>
                <input type="text" id="usuario" required class="w-full p-3 border rounded-md" placeholder="gestor ou admin@...">
            </div>
            <div>
                <label class="block font-semibold mb-1">Senha mestra</label>
                <input type="password" id="senha" required class="w-full p-3 border rounded-md">
            </div>
            <p id="msgErro" class="text-red-500 text-sm hidden">Usuário ou senha incorretos</p>
            <button type="submit" class="w-full bg-primary text-white p-3 rounded-md font-bold hover:bg-blue-900">
                Entrar
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-500">
            <a href="login.html" class="text-secondary font-bold">Login de membros</a>
            ·
            <a href="index.html" class="text-secondary font-bold">Início</a>
        </p>
        <p class="mt-3 text-center text-xs text-gray-400">
            Recuperação de senha é apenas para membros cadastrados.
        </p>
    </div>

    <script src="conta.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const u = document.getElementById('usuario').value.trim();
            const s = document.getElementById('senha').value;

            const r = fazerLogin(u, s);
            if (!r.sucesso || !r.usuario || (r.usuario.nivel !== 'gestor' && r.usuario.nivel !== 'admin')) {
                document.getElementById('msgErro').classList.remove('hidden');
                document.getElementById('msgErro').textContent = 'Apenas gestor/admin. Verifique usuário e senha mestra.';
                return;
            }

            // Compatibilidade com código antigo do painel
            sessionStorage.setItem('gestorLogado', JSON.stringify({
                usuario: u,
                nome: r.usuario.nome,
                nivel: r.usuario.nivel
            }));

            window.location.href = 'adminpainel.html';
        });
    </script>
</body>
</html>
