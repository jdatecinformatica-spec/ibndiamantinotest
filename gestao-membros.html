<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Membros — IBN Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#0A1A3F', secondary: '#D4AF37', accent: '#1E3A8A', light: '#F8F9FC' }
                }
            }
        }
    </script>
</head>
<body class="bg-light min-h-screen">
    <header class="bg-primary text-white py-4 px-4 shadow">
        <div class="container mx-auto flex flex-wrap items-center justify-between gap-3">
            <div>
                <h1 class="text-xl font-bold">Gestão de Membros</h1>
                <span id="nivelUsuario" class="text-secondary text-sm font-bold"></span>
            </div>
            <div class="flex gap-3 text-sm">
                <a href="adminpainel.html" class="hover:text-secondary">← Painel</a>
                <a href="#" id="btnSair" class="hover:text-red-300">Sair</a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl">
        <!-- Filtros -->
        <div class="bg-white rounded-xl shadow p-4 mb-6 flex flex-wrap gap-3 items-end">
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Status</label>
                <select id="filtroStatus" class="border rounded-lg px-3 py-2 text-sm">
                    <option value="">Todos</option>
                    <option value="pendente">Pendentes</option>
                    <option value="aprovado">Aprovados</option>
                    <option value="rejeitado">Rejeitados</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-1">Buscar</label>
                <input type="text" id="filtroBusca" placeholder="Nome, e-mail..." class="border rounded-lg px-3 py-2 text-sm">
            </div>
            <button id="btnFiltrar" class="bg-primary text-white px-4 py-2 rounded-lg text-sm font-bold">Filtrar</button>
        </div>

        <div id="lista" class="space-y-4"></div>
        <p id="vazio" class="text-center text-gray-400 py-12 hidden">Nenhum membro encontrado.</p>

        <!-- Bloqueios (reversíveis) -->
        <section class="mt-10 border-t pt-8">
            <h2 class="text-lg font-bold text-primary mb-1"><i class="fa fa-ban"></i> Cadastros bloqueados</h2>
            <p class="text-sm text-gray-500 mb-4">O bloqueio é <strong>reversível</strong>. Use <strong>Desbloquear</strong> para liberar nome, e-mail ou telefone novamente.</p>
            <div id="listaBloqueios" class="space-y-2"></div>
            <p id="vazioBloqueios" class="text-center text-gray-400 py-6 text-sm">Nenhum bloqueio ativo.</p>
        </section>
    </main>

    <!-- Modal aprovar -->
    <div id="modalAprovar" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 max-h-[90vh] overflow-y-auto">
            <h2 class="text-xl font-bold text-primary mb-1">Aprovar e alocar</h2>
            <p id="modalNome" class="text-gray-600 mb-4"></p>

            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-bold mb-1">Nível de acesso</label>
                    <select id="alocNivel" class="w-full border rounded-lg px-3 py-2">
                        <option value="membro">Membro</option>
                        <option value="lider_celula">Líder de Célula</option>
                        <option value="lider_ministerio">Líder de Ministério</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Cargo</label>
                    <select id="alocCargo" class="w-full border rounded-lg px-3 py-2"></select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Função específica</label>
                    <input type="text" id="alocFuncao" class="w-full border rounded-lg px-3 py-2" placeholder="Anfitrião, discipulador...">
                </div>
                <div id="wrapLiderCel">
                    <label class="block text-sm font-bold mb-1">Lidera qual célula? (se for líder de célula / em treinamento)</label>
                    <select id="alocLideraCelula" class="w-full border rounded-lg px-3 py-2">
                        <option value="">— Nenhuma —</option>
                    </select>
                </div>
                <div id="wrapLiderMin">
                    <label class="block text-sm font-bold mb-1">Lidera qual ministério? (se for líder de ministério)</label>
                    <select id="alocLideraMinisterio" class="w-full border rounded-lg px-3 py-2">
                        <option value="">— Nenhum —</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Célula Terça (participa)</label>
                    <select id="alocTerca" class="w-full border rounded-lg px-3 py-2">
                        <option value="">— Nenhuma —</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Célula Sábado</label>
                    <select id="alocSabado" class="w-full border rounded-lg px-3 py-2">
                        <option value="">— Nenhuma —</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">Ministérios</label>
                    <div id="alocMins" class="grid grid-cols-2 gap-1 text-sm max-h-32 overflow-y-auto border rounded-lg p-2"></div>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button id="btnConfirmarAprovar" class="flex-1 bg-green-600 text-white py-2 rounded-lg font-bold">Aprovar</button>
                <button id="btnFecharModal" class="flex-1 border py-2 rounded-lg font-bold">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="nuvem.js"></script>
    <script src="conta.js"></script>
    <script>
        const usuario = getUsuarioLogado();
        if (!usuario || !isAdmin(usuario)) {
            alert('Acesso restrito a gestores e administradores.');
            window.location.href = 'login.html';
        }

        document.getElementById('nivelUsuario').textContent =
            usuario.nivel === 'gestor' ? 'Gestor Master' : 'Administrador';
        document.getElementById('btnSair').addEventListener('click', function(e) {
            e.preventDefault();
            sair();
        });

        // Preenche selects do modal
        LISTA_CARGOS.forEach(c => {
            document.getElementById('alocCargo').innerHTML += `<option value="${c}">${c}</option>`;
        });
        LISTA_CELULAS.forEach(c => {
            document.getElementById('alocLideraCelula').innerHTML += `<option value="${c.id}">${c.nome}</option>`;
        });
        LISTA_MINISTERIOS.forEach(m => {
            document.getElementById('alocLideraMinisterio').innerHTML += `<option value="${m}">${m}</option>`;
        });
        LISTA_CELULAS.filter(c => c.dia === 'terca').forEach(c => {
            document.getElementById('alocTerca').innerHTML += `<option value="${c.id}">${c.nome}</option>`;
        });
        LISTA_CELULAS.filter(c => c.dia === 'sabado').forEach(c => {
            document.getElementById('alocSabado').innerHTML += `<option value="${c.id}">${c.nome}</option>`;
        });
        LISTA_MINISTERIOS.forEach(m => {
            document.getElementById('alocMins').innerHTML += `
                <label class="flex items-center gap-1">
                    <input type="checkbox" name="alocMin" value="${m}" class="accent-secondary"> ${m}
                </label>`;
        });

        let membroAtualId = null;

        function badgeStatus(s) {
            const map = {
                pendente: 'bg-yellow-100 text-yellow-800',
                aprovado: 'bg-green-100 text-green-800',
                rejeitado: 'bg-red-100 text-red-800'
            };
            return `<span class="text-xs px-2 py-0.5 rounded-full font-bold ${map[s] || 'bg-gray-100'}">${s || '—'}</span>`;
        }


        async function removerMembroDef(id) {
            const m = lerMembros().find(x => String(x.id) === String(id));
            if (!m) return;
            if (!confirm('REMOVER DEFINITIVAMENTE\\n\\n' + m.nome + '\\n' + (m.email || '') + '\\n\\nApaga sem deixar vestígios.\\nA pessoa poderá se cadastrar de novo com o mesmo nome, e-mail ou telefone.\\n\\nConfirma?')) return;
            const r = excluirMembroDefinitivo(id);
            if (r.sucesso) {
                try {
                    if (typeof IBNNuvem !== 'undefined' && IBNNuvem.removerMembroNuvem) {
                        await IBNNuvem.removerMembroNuvem(id);
                    }
                } catch (e) {}
                alert('Membro removido. Pode cadastrar de novo com os mesmos dados.');
                renderizar();
                renderBloqueios();
            } else {
                alert(r.mensagem || 'Não foi possível remover.');
            }
        }

        function bloquearMembro(id) {
            const m = lerMembros().find(x => String(x.id) === String(id));
            if (!m) return;
            const motivo = prompt('Bloquear cadastro de:\\n' + m.nome + '\\n' + (m.email || '') + '\\n' + (m.telefone || '') + '\\n\\nMotivo (opcional):', '');
            if (motivo === null) return;
            const r = bloquearCadastro({
                nome: m.nome,
                email: m.email,
                telefone: m.telefone,
                motivo: motivo
            });
            if (!r.sucesso) {
                alert(r.mensagem || 'Falha ao bloquear.');
                return;
            }
            const tb = confirm('Bloqueio criado.\\n\\nDeseja TAMBÉM remover o cadastro atual desta pessoa?\\n(OK = remove + bloqueia | Cancelar = só bloqueia)');
            if (tb) {
                excluirMembroDefinitivo(id);
                if (typeof IBNNuvem !== 'undefined' && IBNNuvem.removerMembroNuvem) {
                    IBNNuvem.removerMembroNuvem(id);
                }
            }
            alert('Pronto. Nome, e-mail e telefone bloqueados para novo cadastro.');
            renderizar();
            renderBloqueios();
        }

        function renderizar() {
            const status = document.getElementById('filtroStatus').value;
            const busca = document.getElementById('filtroBusca').value.toLowerCase().trim();
            let lista = lerMembros();

            if (status) lista = lista.filter(m => m.status === status);
            if (busca) {
                lista = lista.filter(m =>
                    (m.nome || '').toLowerCase().includes(busca) ||
                    (m.email || '').toLowerCase().includes(busca) ||
                    (m.telefone || '').includes(busca)
                );
            }

            // Pendentes primeiro
            lista.sort((a, b) => {
                if (a.status === 'pendente' && b.status !== 'pendente') return -1;
                if (b.status === 'pendente' && a.status !== 'pendente') return 1;
                return (b.dataCadastro || '').localeCompare(a.dataCadastro || '');
            });

            const container = document.getElementById('lista');
            document.getElementById('vazio').classList.toggle('hidden', lista.length > 0);

            container.innerHTML = lista.map(m => {
                const celulasTxt = (m.celulas || []).map(c => c.nome).join(', ') || '—';
                const minsTxt = (m.ministerios || []).join(', ') || '—';
                return `
                <div class="bg-white rounded-xl shadow p-4 border-l-4 ${m.status === 'pendente' ? 'border-yellow-400' : m.status === 'aprovado' ? 'border-green-500' : 'border-gray-300'}">
                    <div class="flex flex-wrap justify-between gap-2 mb-2">
                        <div>
                            <h3 class="font-bold text-primary text-lg">${m.nome}</h3>
                            <p class="text-sm text-gray-500">${m.email || ''} · ${m.telefone || ''}</p>
                        </div>
                        ${badgeStatus(m.status)}
                    </div>
                    <div class="text-sm text-gray-600 grid sm:grid-cols-2 gap-1 mb-3">
                        <p><strong>Cargo:</strong> ${m.cargo || 'Membro'}</p>
                        <p><strong>Nível:</strong> ${m.nivel || 'membro'}</p>
                        <p><strong>Células:</strong> ${celulasTxt}</p>
                        <p><strong>Ministérios:</strong> ${minsTxt}</p>
                        ${m.funcaoEspecifica ? `<p class="sm:col-span-2"><strong>Função:</strong> ${m.funcaoEspecifica}</p>` : ''}
                    </div>
                    <div class="flex flex-wrap gap-2">
                        ${m.status === 'pendente' ? `
                            <button onclick="abrirAprovar(${m.id})" class="bg-green-600 text-white px-3 py-1.5 rounded-lg text-sm font-bold">
                                <i class="fa fa-check"></i> Aprovar / Alocar
                            </button>
                            <button onclick="fazerRejeitar(${m.id})" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg text-sm font-bold">
                                Rejeitar
                            </button>
                        ` : `
                            <button onclick="abrirAprovar(${m.id})" class="bg-primary text-white px-3 py-1.5 rounded-lg text-sm font-bold">
                                Editar alocação
                            </button>
                        `}
                        <button onclick="resetSenha(${m.id})" class="border px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-gray-50">
                            <i class="fa fa-key"></i> Resetar senha
                        </button>
                        <button onclick="bloquearMembro(${m.id})" class="border border-amber-500 text-amber-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-amber-50">
                            <i class="fa fa-ban"></i> Bloquear
                        </button>
                        <button onclick="removerMembroDef(${m.id})" class="border border-red-500 text-red-600 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-red-50">
                            <i class="fa fa-trash"></i> Remover
                        </button>
                    </div>
                </div>`;
            }).join('');
        }

        function abrirAprovar(id) {
            membroAtualId = id;
            const m = lerMembros().find(x => String(x.id) === String(id));
            if (!m) return;
            document.getElementById('modalNome').textContent = m.nome;
            document.getElementById('alocNivel').value = m.nivel || 'membro';
            document.getElementById('alocCargo').value = m.cargo || 'Membro';
            document.getElementById('alocFuncao').value = m.funcaoEspecifica || '';
            document.getElementById('alocLideraCelula').value = m.lideraCelulaId || '';
            document.getElementById('alocLideraMinisterio').value = m.lideraMinisterio || '';
            const terca = (m.celulas || []).find(c => c.dia === 'terca');
            const sabado = (m.celulas || []).find(c => c.dia === 'sabado');
            document.getElementById('alocTerca').value = terca ? terca.id : '';
            document.getElementById('alocSabado').value = sabado ? sabado.id : '';
            document.querySelectorAll('input[name="alocMin"]').forEach(el => {
                el.checked = (m.ministerios || []).includes(el.value);
            });
            const modal = document.getElementById('modalAprovar');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        document.getElementById('btnFecharModal').addEventListener('click', function() {
            const modal = document.getElementById('modalAprovar');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        document.getElementById('btnConfirmarAprovar').addEventListener('click', function() {
            const celulas = [];
            const idT = document.getElementById('alocTerca').value;
            const idS = document.getElementById('alocSabado').value;
            if (idT) {
                const c = LISTA_CELULAS.find(x => x.id === idT);
                if (c) celulas.push(c);
            }
            if (idS) {
                const c = LISTA_CELULAS.find(x => x.id === idS);
                if (c) celulas.push(c);
            }
            const ministerios = [];
            document.querySelectorAll('input[name="alocMin"]:checked').forEach(el => ministerios.push(el.value));

            const r = aprovarMembro(membroAtualId, {
                nivel: document.getElementById('alocNivel').value,
                cargo: document.getElementById('alocCargo').value,
                funcaoEspecifica: document.getElementById('alocFuncao').value.trim(),
                celulas,
                ministerios
            });
            if (!r.sucesso) {
                alert(r.mensagem);
                return;
            }
            document.getElementById('modalAprovar').classList.add('hidden');
            document.getElementById('modalAprovar').classList.remove('flex');
            renderizar();
        });

        function fazerRejeitar(id) {
            if (!confirm('Rejeitar este cadastro?')) return;
            rejeitarMembro(id);
            renderizar();
        }

        function resetSenha(id) {
            if (!confirm('Gerar senha temporária para este membro?')) return;
            const r = resetarSenhaPorGestor(id);
            if (r.sucesso) {
                alert('Senha temporária:\n\n' + r.senhaTemporaria + '\n\nAnote e informe ao membro.');
            } else {
                alert(r.mensagem);
            }
        }

        function renderBloqueios() {
            var box = document.getElementById('listaBloqueios');
            var vazio = document.getElementById('vazioBloqueios');
            if (!box) return;
            var lista = (typeof lerBloqueios === 'function') ? lerBloqueios() : [];
            if (!lista.length) {
                box.innerHTML = '';
                if (vazio) vazio.classList.remove('hidden');
                return;
            }
            if (vazio) vazio.classList.add('hidden');
            box.innerHTML = lista.map(function(b) {
                var partes = [];
                if (b.nome) partes.push('Nome: ' + b.nome);
                if (b.email) partes.push('E-mail: ' + b.email);
                if (b.telefone) partes.push('Tel: ' + b.telefone);
                var quando = b.em ? new Date(b.em).toLocaleString('pt-BR') : '';
                return '<div class="bg-amber-50 border border-amber-200 rounded-xl p-3 flex flex-wrap justify-between gap-2 items-center">' +
                    '<div class="text-sm">' +
                    '<p class="font-semibold text-amber-900">' + partes.join(' · ') + '</p>' +
                    '<p class="text-xs text-gray-500">Por ' + (b.porNome || '—') + (quando ? ' · ' + quando : '') +
                    (b.motivo ? ' · Motivo: ' + b.motivo : '') + '</p></div>' +
                    '<button type="button" class="btn-desbloq border border-green-600 text-green-700 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-green-50" data-id="' + b.id + '">' +
                    '<i class="fa fa-unlock"></i> Desbloquear</button></div>';
            }).join('');
            box.querySelectorAll('.btn-desbloq').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    if (!confirm('Desbloquear este cadastro?\n\nA pessoa poderá se inscrever de novo com esses dados.')) return;
                    var r = desbloquearCadastro(btn.getAttribute('data-id'));
                    if (r.sucesso) {
                        alert('Desbloqueado.');
                        renderBloqueios();
                    } else {
                        alert(r.mensagem || 'Não foi possível desbloquear.');
                    }
                });
            });
        }

        document.getElementById('btnFiltrar').addEventListener('click', renderizar);
        document.getElementById('filtroBusca').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') renderizar();
        });

        renderizar();
    </script>
</body>
</html>
