<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso — IBN Diamantino</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0A1A3F',
                        secondary: '#D4AF37',
                        light: '#F8F9FC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-light min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <i class="fa fa-lock text-4xl text-primary mb-2"></i>
            <h1 class="text-2xl font-bold text-primary">Acesso Restrito</h1>
            <p class="text-gray-500">IBN Diamantino</p>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-lg">
            <form id="formLogin" class="space-y-5">
                <div>
                    <label for="identificador" class="block text-sm font-bold text-gray-700 mb-1">E-mail ou Telefone</label>
                    <input 
                        type="text" 
                        id="identificador" 
                        name="identificador" 
                        required
                        placeholder="seu@email.com ou telefone"
                        class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-secondary focus:outline-none transition-colors"
                        autocomplete="off"
                    >
                </div>

                <div>
                    <label for="senha" class="block text-sm font-bold text-gray-700 mb-1">Senha</label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="senha" 
                            name="senha" 
                            required
                            placeholder="Digite sua senha"
                            class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-secondary focus:outline-none transition-colors pr-12"
                            autocomplete="off"
                        >
                        <button type="button" id="btnOlho" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fa fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-primary text-white py-3 rounded-lg font-bold hover:bg-opacity-90 transition-colors flex items-center justify-center gap-2"
                >
                    <i class="fa fa-sign-in"></i> Entrar
                </button>

                <p id="mensagem" class="text-sm text-center hidden mt-2"></p>
            </form>

            <div class="mt-6 text-center space-y-3">
                <p class="text-sm text-gray-500">
                    Quer se tornar membro? 
                    <a href="cadastro.html" class="text-secondary font-bold hover:underline">Cadastre-se aqui</a>
                </p>
                <a href="index.html" class="inline-block text-primary font-medium hover:underline">
                    ← Voltar ao site
                </a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔑 CONTAS MESTRAS — SEMPRE FUNCIONAM
        // ==========================================
        const CONTAS_MESTRAS = [
            {
                nome: 'Gestor Master',
                email: 'gestor@ibndiamantino.com.br',
                senha: 'IBN-Gestor-2026!',
                nivel: 'gestor'
            },
            {
                nome: 'Admin Master',
                email: 'admin@ibndiamantino.com.br',
                senha: 'IBN-Admin-2026!',
                nivel: 'admin'
            }
        ];

        // ==========================================
        // 👁️ Mostrar/Ocultar senha
        // ==========================================
        document.getElementById('btnOlho').addEventListener('click', function() {
            const campo = document.getElementById('senha');
            const icone = this.querySelector('i');
            if (campo.type === 'password') {
                campo.type = 'text';
                icone.className = 'fa fa-eye-slash';
            } else {
                campo.type = 'password';
                icone.className = 'fa fa-eye';
            }
        });

        // ==========================================
        // ✅ LOGIN CORRIGIDO — Busca exata, sem restos
        // ==========================================
        document.getElementById('formLogin').addEventListener('submit', function(e) {
            e.preventDefault();
            
            let identificador = document.getElementById('identificador').value.trim();
            const senha = document.getElementById('senha').value;
            const msg = document.getElementById('mensagem');

            // Normalizar: email em minúsculas, telefone só números
            const identMinusculo = identificador.toLowerCase();
            const identNumeros = identificador.replace(/\D/g, '');

            let usuario = null;

            // 1️⃣ Verificar CONTAS MESTRAS primeiro
            usuario = CONTAS_MESTRAS.find(acc => 
                acc.email.toLowerCase() === identMinusculo && acc.senha === senha
            );

            // 2️⃣ Se não for mestra, verificar Administradores nomeados
            if (!usuario) {
                const admins = JSON.parse(localStorage.getItem('adminsNomeados') || '[]');
                usuario = admins.find(a => {
                    const emailOk = (a.email || '').trim().toLowerCase() === identMinusculo;
                    const telOk = (a.telefone || '').replace(/\D/g, '') === identNumeros;
                    const senhaOk = a.senha === senha;
                    return (emailOk || telOk) && senhaOk;
                });
                if (usuario) usuario.nivel = 'admin';
            }

            // 3️⃣ Se não for admin, verificar MEMBROS COMUNS
            if (!usuario) {
                const todosMembros = JSON.parse(localStorage.getItem('membrosCadastrados') || '[]');
                
                // ✅ FILTRO: ignora quem foi REMOVIDO
                const membrosAtivos = todosMembros.filter(m => m.removido !== true);
                
                usuario = membrosAtivos.find(m => {
                    const emailOk = (m.email || '').trim().toLowerCase() === identMinusculo;
                    const telOk = (m.telefone || '').replace(/\D/g, '') === identNumeros;
                    const senhaOk = m.senha === senha;
                    return (emailOk || telOk) && senhaOk;
                });
                
                if (usuario) usuario.nivel = 'membro';
            }

            // ✅ Resultado
            if (usuario) {
                localStorage.setItem('usuarioLogado', JSON.stringify({
                    nome: usuario.nome || 'Usuário',
                    email: usuario.email || '',
                    telefone: usuario.telefone || '',
                    nivel: usuario.nivel
                }));

                msg.textContent = '✅ Entrando...';
                msg.className = 'text-sm text-center text-green-600 font-bold mt-2';
                msg.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 600);
            } else {
                msg.textContent = '❌ Dados incorretos. Verifique e tente novamente.';
                msg.className = 'text-sm text-center text-red-500 mt-2';
                msg.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
